<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <style>
    body {
      background: #ffe6f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #ff2d6f;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    button {
      background: #ff2d6f;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background: #e6004c;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Valentine’s Day ❤️</h1>
    <p>
      Dear <b>Hridhya</b>,  
      you are my favorite person in this whole world 🥺✨  
    </p>

    <button onclick="alert('I love you forever ❤️')">
      Click Me 💌
    </button>
  </div>
</body>
</html>
